<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1{ /*box-level*/
            background-color: azure;

            height:300px;
            width:300px ;
            
            border: 10px solid  rgba(18, 51, 95, 0.26);

            padding: 10px 10px 10px 10px;

            margin: 20px auto 50px auto;

            outline: 5px dashed salmon;

        }
        a{  /*inline-level*/
            border-width: 1px;
            border-style: solid;
            border-color: blanchedalmond;
            padding: 1px 10px 1px 10px;
        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>parágrafos tambem são exemplos de box-level, mas os <a href="#">links são exemplos de caixa inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
