<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>testando o uso de um iframe</h1>
    <p>Acessando o site do 

        <!--Tamanho padrão 300x150-->
       <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" width="500px" scolling="no">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em video</a>
       </iframe>
        
        para aprender a programar.
    </p>
    <p>
        O repositório do Guanabara 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
           no <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
        </iframe>
        também é legal
    </p>
    <iframe src="teste.html" frameborder="0"></iframe>
</body>
</html>
