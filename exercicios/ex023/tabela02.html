<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        .n{
            text-align: right;
        }
        thead, tfoot {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <hr>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH  
            TFOOT
                TR, TD, TH  
    -->

    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="n">46 179 008</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="n">21 460 311</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="n">17 225 410</td>
            </tr>
           
            
        </tbody>

        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td class="n"><strong>214 211 951</strong></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
