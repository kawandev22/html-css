<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midias em html5</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>abra o site em diferesnte dispositivos ou diminua e aumente o tamnho do navegador</p>
    <picture>
        <source media="(max-width:740px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1040px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>reproduzindo audio</h1>
    <p>audios em html5</p>
    <audio src="midia/By Myself - The Grey Room _ Clark Sims.mp3"  controls></audio>
    <audio preload="metadata" autoplay controls loop>
<source src="midia/By Myself - The Grey Room _ Clark Sims.mp3" type="audio/mpeg">
<source src="midia/By Myself - The Grey Room _ Clark Sims.ogg" type="audio/ogg">
<source src="midia/By Myself - The Grey Room _ Clark Sims.wav" type="audio/wav">
<p>o navegador n tem suporte para este audio</p>
    </audio>
</body>
</html>
