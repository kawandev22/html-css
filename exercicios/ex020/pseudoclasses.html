<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo classes</title>
    <style>
        div {
            display: inline-block   ;
            background-color: lightgrey;
            border: solid 1px black;
            text-align: center;
            width: 200px;
            height: 200px;
        }
        div:hover {
            background-color: aliceblue;
        }
    </style>
</head>
<body>
    <div>1</div>
    <div>2</div>
    <div>3</div>
</body>
</html>
