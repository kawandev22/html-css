<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-elemento
        > filho 
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: rgb(124, 79, 20);
            text-decoration: none;
        }
        a:visited{
            color: darkgoldenrod;
        }
        a:active {
            color: aliceblue;
        }
        a::after {
            content: ' [link]';
            text-decoration: none ;
            font-weight: normal;
            color: darkgrey;
        }
    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li><a href="https://spacex.com" target="_blank">spaceX</a></li>
        <li><a href="https://youtube.com" target="_blank">youtube</a></li>
        <li><a href="https://tinkercad.com" target="_blank">tinkercad</a></li>
    </ul>
</body>
</html>
